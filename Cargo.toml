[package]
name = "jedi_mouse"
version = "0.1.0"
edition = "2021"

[dependencies]
winres = "0.1"
vosk = "0.3"
cpal = "0.18.2"
nokhwa = { version = "0.10", features = ["input-native"] }
image = "0.25"
minifb = "0.29"
ort = { version = "=2.0.0-rc.15", features = ["download-binaries", "tls-native"] }
ort-sys = "=2.0.0-rc.15"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1"
